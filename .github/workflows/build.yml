# Builds the RollOnRV app for iOS.
# - Unsigned .app on every push (macOS runner, verifies the project compiles).
# - Signed .ipa only when the Apple signing secrets are present
#   (APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_PROVISIONING_PROFILE_BASE64).
# - Uploads the signed .ipa to TestFlight only when the App Store Connect
#   API key secrets exist (APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8).
# Dependencies are installed with bun (bun.lock is the lockfile; npm ci has
# no package-lock.json to work from). The 337-test suite runs on every build.
name: Build RollOnRV app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    name: iOS build (unsigned, or signed .ipa when secrets are set)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install dependencies
        run: bun install
      - name: Run test suite
        run: npm test
      - name: Sync Capacitor
        run: bunx cap sync ios
      - name: Build (unsigned, for checking the project compiles)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      # Signed .ipa (TestFlight) — only runs when secrets exist.
      - name: Import signing certificate
        if: env.APPLE_CERT_P12_BASE64 != ''
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
      - name: Install provisioning profile
        if: env.APPLE_PROVISIONING_PROFILE_BASE64 != ''
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      - name: Archive + export signed .ipa
        if: env.APPLE_PROVISIONING_PROFILE_BASE64 != ''
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="RollOnRV App"
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build -exportOptionsPlist ios/App/ExportOptions.plist
      - name: Upload .ipa
        if: env.APPLE_PROVISIONING_PROFILE_BASE64 != ''
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: rollonrv-ios-ipa
          path: build/*.ipa
      # Upload the signed .ipa to TestFlight — only runs when the API key exists.
      - name: Find .ipa
        if: env.APPLE_API_KEY_ID != ''
        id: find-ipa
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: echo "ipa-path=$(ls build/*.ipa | head -1)" >> $GITHUB_OUTPUT
      - name: Upload to TestFlight
        if: env.APPLE_API_KEY_ID != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.find-ipa.outputs.ipa-path }}
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_KEY_P8 }}
