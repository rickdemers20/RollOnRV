<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- RollOnRV icon — original mark: a logbook page with a red stamp border.
       Cream paper, ink text, red stamp. No logos, no stock art. -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="#f7f3e8"/>
  <rect x="72" y="72" width="880" height="880" rx="40" fill="#fffdf4" stroke="#b3372c" stroke-width="26"/>
  <line x1="220" y1="72" x2="220" y2="952" stroke="#b3372c" stroke-width="10" opacity="0.45"/>
  <text x="560" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="480" font-weight="600" fill="#22304a" text-anchor="middle">R</text>
  <line x1="330" y1="730" x2="790" y2="730" stroke="#b3372c" stroke-width="16" stroke-linecap="round"/>
  <text x="560" y="850" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#b3372c" text-anchor="middle" letter-spacing="14">ROLLONRV</text>
</svg>
